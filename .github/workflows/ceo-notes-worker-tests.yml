name: CEO Notes Worker Tests

on:
  pull_request:
    paths:
      - "workers/ceo-notes-ai/**"
      - ".github/workflows/ceo-notes-worker-tests.yml"

permissions:
  contents: read

concurrency:
  group: ceo-notes-worker-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check workers/ceo-notes-ai/worker-v2.js
      - name: Run isolated Worker tests
        run: node --test workers/ceo-notes-ai/worker-v2.test.mjs
