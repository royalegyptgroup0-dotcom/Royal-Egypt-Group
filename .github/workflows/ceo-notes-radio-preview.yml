name: CEO Notes radio preview

on:
  push:
    branches:
      - feature/ceo-notes-radio-preview
    paths:
      - "notes/**"
      - ".github/workflows/ceo-notes-radio-preview.yml"

permissions:
  contents: read

concurrency:
  group: ceo-notes-radio-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feature/ceo-notes-radio-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated CEO Notes branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site and radio before preview
        run: |
          node --check notes/radio.js
          node notes/validate.mjs

      - name: Verify preview-only credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy isolated preview (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f3a178fb5329d771a40bc55d7ac140e6
        run: |
          npx --yes wrangler@4 pages deploy notes \
            --project-name ceo-notes \
            --branch radio-preview \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "CEO Notes radio preview"
