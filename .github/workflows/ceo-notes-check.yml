name: CEO Notes site checks

on:
  push:
    branches: [ceo-notes-site]
    paths:
      - "notes/**"
      - "workers/ceo-notes-ai/**"
      - ".github/workflows/ceo-notes-check.yml"
      - "scripts/build-ceo-notes-worker.mjs"
      - "scripts/import-ceo-facebook-archive.mjs"
      - "scripts/import-ceo-facebook-archive.test.mjs"
  pull_request:
    paths:
      - "notes/**"
      - "workers/ceo-notes-ai/**"
      - "scripts/import-ceo-facebook-archive.mjs"
      - "scripts/import-ceo-facebook-archive.test.mjs"
      - ".github/workflows/ceo-notes-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check CEO Notes AI Worker syntax
        run: node --check workers/ceo-notes-ai/worker.js
      - name: Test CEO Notes AI Worker access controls
        run: node --test workers/ceo-notes-ai/worker.test.mjs
      - name: Validate isolated CEO Notes preview Worker config
        run: |
          node -e 'const fs=require("node:fs"); const assert=require("node:assert/strict"); const c=JSON.parse(fs.readFileSync("workers/ceo-notes-ai/wrangler.preview.jsonc","utf8")); assert.equal(c.name,"ceo-notes-ai-preview"); assert.equal(c.main,"worker-v2.js"); assert.equal(c.kv_namespaces[0].binding,"CEO_NOTES_KV"); assert.notEqual(c.kv_namespaces[0].id,"a7903131eb7545d0b255ca45216b5fa7"); assert.equal(c.durable_objects.bindings[0].name,"OUTBOX_COORDINATOR"); assert.equal(c.durable_objects.bindings[0].class_name,"CEOOutboxCoordinator"); assert.deepEqual(c.migrations[0].new_sqlite_classes,["CEOOutboxCoordinator"]);'
      - name: Check CEO Notes AI Worker v2 syntax
        run: node --check workers/ceo-notes-ai/worker-v2.js
      - name: Test CEO Notes AI Worker v2 outbox and recovery
        run: node --test workers/ceo-notes-ai/worker-v2.test.mjs
      - name: Check radio JavaScript syntax
        run: node --check notes/radio.js
      - name: Check Pages Worker JavaScript syntax
        run: node --check --input-type=module < notes/_worker.js
      - name: Verify generated CEO Notes Worker is synchronized
        run: node scripts/build-ceo-notes-worker.mjs
      - name: Validate CEO Notes content and site
        run: node notes/validate.mjs
      - name: Test market freshness and stale fallback
        run: node notes/test-market-stale.mjs

      - name: Check Facebook archive importer syntax
        run: node --check scripts/import-ceo-facebook-archive.mjs
      - name: Test offline Facebook archive importer
        run: node --test scripts/import-ceo-facebook-archive.test.mjs
