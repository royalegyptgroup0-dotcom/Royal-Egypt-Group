name: CEO Notes site checks

on:
  push:
    branches: [ceo-notes-site]
    paths:
      - "notes/**"
      - ".github/workflows/ceo-notes-check.yml"
  pull_request:
    paths:
      - "notes/**"
      - ".github/workflows/ceo-notes-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CEO Notes content and site
        run: node notes/validate.mjs
