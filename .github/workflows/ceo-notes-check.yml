name: CEO Notes site checks

on:
  push:
    branches: [ceo-notes-site]
    paths:
      - "notes/**"
      - ".github/workflows/ceo-notes-check.yml"
      - "scripts/build-ceo-notes-worker.mjs"
  pull_request:
    paths:
      - "notes/**"
      - ".github/workflows/ceo-notes-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check radio JavaScript syntax
        run: node --check notes/radio.js
      - name: Check Pages Worker JavaScript syntax
        run: node --check --input-type=module < notes/_worker.js
      - name: Verify Worker bundle synchronization
        run: node scripts/build-ceo-notes-worker.mjs
      - name: Validate CEO Notes content and site
        run: node notes/validate.mjs
