<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة الإعلانات | Royal Egypt</title><link rel="stylesheet" href="/assets/royal.css"><style>.admin-wrap{max-width:900px;margin:50px auto;padding:20px}.admin-card{background:#151819;border:1px solid #ffffff22;border-radius:14px;padding:20px;margin:15px 0}.admin-card h2{margin-top:0}.admin-card p{color:#bbb;white-space:pre-wrap}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-actions button{border:0;border-radius:7px;padding:10px 18px;cursor:pointer;font-weight:700}.approve{background:#c8a568}.reject{background:#402626;color:#fff}.admin-input{width:100%;padding:12px;background:#080a0b;color:white;border:1px solid #ffffff33;border-radius:7px;margin:8px 0 15px}</style></head><body><main class="admin-wrap"><div class="eyebrow">ROYAL EGYPT GROUP · PRIVATE ADMIN</div><h1>مراجعة الإعلانات العقارية</h1><p>هذه الصفحة للإدارة فقط. لا تشارك رمز الدخول مع أي شخص.</p><label for="token">رمز الإدارة</label><input class="admin-input" id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"><button class="btn" id="load">عرض الإعلانات المعلقة</button><p id="status" role="status"></p><section id="items"></section></main><script>
const token=document.getElementById("token"),status=document.getElementById("status"),items=document.getElementById("items");
async function api(method="GET",body){const r=await fetch("/api/admin/listings",{method,headers:{"authorization":"Bearer "+token.value,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر إتمام الطلب");return d}
function render(rows){items.replaceChildren();if(!rows.length){status.textContent="لا توجد إعلانات معلقة حاليًا.";return}status.textContent="عدد الإعلانات المعلقة: "+rows.length;for(const x of rows){const card=document.createElement("article");card.className="admin-card";const h=document.createElement("h2");h.textContent=x.title;const p=document.createElement("p");p.textContent=["صاحب الإعلان: "+x.contact_name,"الهاتف: "+x.contact_phone,"النوع: "+x.property_type,"الموقع: "+x.location,"المساحة: "+(x.area_sqm||"غير محددة"),"السعر: "+(x.price||"غير محدد"),"الغرض: "+(x.purpose||""),"التفاصيل: "+x.description,"تاريخ الاستلام: "+x.created_at,"عدد الصور: "+(x.images||[]).length].join("\n");const actions=document.createElement("div");actions.className="admin-actions";for(const [label,value,cls] of [["موافقة ونشر","approved","approve"],["رفض","rejected","reject"]]){const b=document.createElement("button");b.textContent=label;b.className=cls;b.addEventListener("click",async()=>{if(!confirm("تأكيد "+label+" الإعلان؟"))return;try{await api("PATCH",{id:x.id,status:value});await load()}catch(e){status.textContent=e.message}});actions.appendChild(b)}card.append(h,p,actions);items.appendChild(card)}}
async function load(){status.textContent="جارٍ تحميل الإعلانات...";try{const d=await api();render(d.listings||[])}catch(e){status.textContent=e.message;items.replaceChildren()}}
document.getElementById("load").addEventListener("click",load);
</script></body></html>
