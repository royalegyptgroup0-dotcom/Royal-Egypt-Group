name = "royalegyptgroup"
compatibility_date = "2026-11-04"
pages_build_output_dir = "./"

# Production remains bound to the live listings database.
[[d1_databases]]
binding = "DB"
database_name = "royal-eg-listings"
database_id = "23185e4e-d299-41b2-abd7-bc533466e94a"

# All Cloudflare Pages Preview deployments use the isolated test database.
# This prevents branch previews from writing to Production D1.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "royal-ai-business-center-test"
database_id = "6e57492c-717d-4fb6-b122-75e5c14cf161"
